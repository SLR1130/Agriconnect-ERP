services:
  - type: web
    name: agriconnect-erp-staging
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: RUN_MIGRATIONS
        value: "false"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: AGRICULTURAL_CLAIM_TICKETS_STAGING_SCHEMA_ENABLED
        value: "false"
      - key: AGRICULTURAL_CLAIM_TICKETS_STAGING_DATABASE
        value: agriconnect_staging
